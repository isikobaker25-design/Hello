<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Mbarara University Of Science And Technology</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background:
                linear-gradient(
                    rgba(7,26,56,0.72),
                    rgba(18,86,160,0.65)
                ),
                url("images.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
        }

        .school-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e8f2ff;
            border-radius: 50%;
            font-size: 32px;
        }

        .school-name {
            text-align: center;
            color: #123c70;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        h1 {
            color: #172b4d;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #344563;
            font-size: 14px;
            font-weight: bold;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d5deeb;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #2878d0;
            box-shadow: 0 0 0 3px rgba(40, 120, 208, 0.13);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 75px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #2466ad;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin: 5px 0 24px;
            font-size: 12px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #52627a;
        }

        .remember input {
            accent-color: #1769c2;
        }

        a {
            color: #1769c2;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #1769c2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .login-button:hover {
            background: #104f96;
            transform: translateY(-1px);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            color: #b42318;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #718096;
            font-size: 12px;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="school-icon" aria-hidden="true">🎓</div>

        <div class="school-name">
            Mbarara University Of Science And Technology
        </div>

        <h1 text align="center">Welcome!</h1>
        

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder=" "
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        Show
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>

                <a href="forgot-password.html">Forgot password?</a>
            </div>

            <button type="submit" class="login-button">
                Sign In
            </button>

            <p id="message" class="message" role="status"></p>

        </form>

        <div class="footer">
            Succeed We Must.<br>
            &copy; Mbarara University Of Science And Technology, 2024. All rights reserved.
        </div>

    </main>

    <script>
        const passwordInput = document.getElementById("password");
        const toggleButton = document.getElementById("togglePassword");
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        toggleButton.addEventListener("click", function () {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleButton.textContent = "Hide";
                toggleButton.setAttribute("aria-label", "Hide password");
            } else {
                passwordInput.type = "password";
                toggleButton.textContent = "Show";
                toggleButton.setAttribute("aria-label", "Show password");
            }
        });

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            message.style.color = "#b42318";
            message.textContent =
                "The login interface is ready. Authentication has not been connected yet.";
        });
    </script>

</body>
</html>
